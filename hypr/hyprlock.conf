# Lock screen, Windows 11 style: the desktop background (not blurred), the
# time on top, the profile picture, the name and the password field in the
# middle. Password and fingerprint both work. Started by scripts/lock.sh,
# which links the current wallpaper and the profile picture into
# ~/.cache/hyprlock.

general {
    hide_cursor = false
    grace = 0
}

background {
    monitor =
    path = ~/.cache/hyprlock/wallpaper
    color = rgb(24, 24, 28)
    blur_passes = 0
    brightness = 0.78
}

# Time and date (top)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.97)
    font_size = 96
    font_family = Inter Display SemiBold, Inter SemiBold, Noto Sans SemiBold
    position = 0, -70
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.95)
    font_size = 20
    font_family = Inter Medium, Inter, Noto Sans
    position = 0, -210
    halign = center
    valign = top
}

# Profile picture (round) and name
image {
    monitor =
    path = ~/.cache/hyprlock/face
    size = 170
    rounding = -1
    border_size = 0
    position = 0, 60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:3600000] n=$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1); printf '%s' "${n:-$USER}" | sed 's/^./\U&/'
    color = rgba(255, 255, 255, 1.0)
    font_size = 26
    font_family = Inter SemiBold, Noto Sans SemiBold
    position = 0, -58
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 38
    outline_thickness = 1
    rounding = 5
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgb(255, 255, 255)
    check_color = rgb(76, 194, 255)
    fail_color = rgb(255, 99, 99)
    fail_text = The password is incorrect. Try again.
    placeholder_text = <span foreground="##ffffffb0">Password</span>
    dots_center = false
    dots_size = 0.2
    fade_on_empty = false
    position = 0, -118
    halign = center
    valign = center
}

# fingerprint: "Scan your finger…" under the field
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(255, 255, 255, 0.85)
    font_size = 12
    font_family = Inter, Noto Sans
    position = 0, -162
    halign = center
    valign = center
}

# Password and fingerprint work in parallel.
# The "login" PAM stack waits for the fingerprint reader first and blocks the
# password, so check the password through Fedora's fingerprint-free stack and
# let hyprlock read the fingerprint itself.
auth {
    pam {
        enabled = true
        module = password-auth
    }
    fingerprint {
        enabled = true
        ready_message = Scan your finger or enter your password
        present_message = Scanning…
    }
}
