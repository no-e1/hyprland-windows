# Lock screen, Windows 11 style

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.2
}

# Clock (large, top center)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 112
    font_family = Inter Display SemiBold, Inter SemiBold, Noto Sans SemiBold
    position = 0, 260
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.9)
    font_size = 22
    font_family = Inter, Noto Sans
    position = 0, 160
    halign = center
    valign = center
}

# User name
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 18
    font_family = Inter SemiBold, Noto Sans SemiBold
    position = 0, -90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 42
    outline_thickness = 1
    rounding = 6
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.10)
    font_color = rgb(255, 255, 255)
    check_color = rgb(76, 194, 255)
    fail_color = rgb(255, 99, 99)
    fail_text = Incorrect password
    placeholder_text = <span foreground="##ffffffaa">Password</span>
    dots_center = true
    dots_size = 0.22
    fade_on_empty = false
    position = 0, -150
    halign = center
    valign = center
}

# Password and fingerprint work in parallel.
# The "login" PAM stack waits for the fingerprint reader first and blocks the
# password, so check the password through Fedora's fingerprint-free stack and
# let hyprlock read the fingerprint itself.
auth {
    pam {
        enabled = true
        module = password-auth
    }
    fingerprint {
        enabled = true
        ready_message = Scan your finger or enter your password
        present_message = Scanning…
    }
}
