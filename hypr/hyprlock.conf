# Sperrbildschirm im Windows-11-Stil

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.2
}

# Uhrzeit (gross, oben mittig)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 112
    font_family = Inter Display SemiBold, Inter SemiBold, Noto Sans SemiBold
    position = 0, 260
    halign = center
    valign = center
}

# Datum
label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_CH.UTF-8 date +"%A, %-d. %B"
    color = rgba(255, 255, 255, 0.9)
    font_size = 22
    font_family = Inter, Noto Sans
    position = 0, 160
    halign = center
    valign = center
}

# Benutzername
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 18
    font_family = Inter SemiBold, Noto Sans SemiBold
    position = 0, -90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 42
    outline_thickness = 1
    rounding = 6
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.10)
    font_color = rgb(255, 255, 255)
    check_color = rgb(76, 194, 255)
    fail_color = rgb(255, 99, 99)
    fail_text = Falsches Passwort
    placeholder_text = <span foreground="##ffffffaa">Passwort</span>
    dots_center = true
    dots_size = 0.22
    fade_on_empty = false
    position = 0, -150
    halign = center
    valign = center
}
