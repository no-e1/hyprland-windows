# Like Windows: lock after 5 min, screen off after 7 min, suspend after 20 min

general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # hold off sleep (lid closed, suspend) until the lock screen is really
    # up – otherwise the laptop fell asleep while lockscreen.py was still
    # starting, and opening the lid showed the desktop for a moment
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
