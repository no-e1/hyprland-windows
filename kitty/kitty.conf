# Windows Terminal look: Campbell color scheme, Cascadia Mono, Windows-style shortcuts

font_family      Cascadia Mono
font_size        12.0
disable_ligatures always

window_padding_width 8 10
cursor_shape         beam
cursor_blink_interval 0.5
scrollback_lines     10000
enable_audio_bell    no
confirm_os_window_close 0
hide_window_decorations yes
remember_window_size no
initial_window_width  110c
initial_window_height 30c

# Tabs on top (only shown with more than one tab)
tab_bar_edge       top
tab_bar_style      separator
tab_separator      ""
tab_title_template " {title} "
tab_bar_min_tabs   2
active_tab_background   #0c0c0c
active_tab_foreground   #ffffff
inactive_tab_background #202020
inactive_tab_foreground #a0a0a0
tab_bar_background      #202020

# Campbell (Windows Terminal default)
background            #0c0c0c
foreground            #cccccc
cursor                #ffffff
selection_background  #3a3a3a
selection_foreground  none
url_color             #3a96dd
color0  #0c0c0c
color1  #c50f1f
color2  #13a10e
color3  #c19c00
color4  #0037da
color5  #881798
color6  #3a96dd
color7  #cccccc
color8  #767676
color9  #e74856
color10 #16c60c
color11 #f9f1a5
color12 #3b78ff
color13 #b4009e
color14 #61d6d6
color15 #f2f2f2

# Windows Terminal shortcuts
map ctrl+c          copy_or_interrupt
map ctrl+v          paste_from_clipboard
map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+w    close_tab
map ctrl+tab        next_tab
map ctrl+shift+tab  previous_tab
map ctrl+equal      change_font_size all +1.0
map ctrl+minus      change_font_size all -1.0
map ctrl+0          change_font_size all 0
