<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Windows' UI font for web pages: Selawik (Microsoft's free stand-in for
  Segoe UI, same metrics – fonts/selawik) answers to the Segoe UI names.

  Microsoft's sign-in pages (and others) ask only for "Segoe UI Webfont",
  -apple-system, Helvetica Neue, Roboto … – no generic "sans-serif" at the
  end. None of them is installed here, so the browser fell back to its serif
  default (Times-like) and the page looked dated.

  Their own @font-face "Segoe UI Webfont" loads the font with
  src: local("Segoe UI Semibold") etc. – local() looks for the full name /
  PostScript name of one file, so every weight also gets Segoe UI's names.

  An alias (<alias><prefer>) is not enough: Chromium/Brave only take a font
  whose own family name is the one the page asked for. So the names are
  added to Selawik itself when fontconfig scans it.
-->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Selawik</string></test>
    <edit name="family" mode="append">
      <string>Segoe UI</string>
      <string>Segoe UI Webfont</string>
      <string>Segoe UI Web (West European)</string>
      <string>Segoe UI Variable</string>
      <string>Segoe UI Variable Text</string>
      <string>Segoe UI Variable Display</string>
    </edit>
  </match>
  <!-- each weight under Segoe UI's full and PostScript name, for local() -->
  <match target="scan">
    <test name="postscriptname"><string>Selawik-Regular</string></test>
    <edit name="fullname" mode="prepend"><string>Segoe UI</string></edit>
    <edit name="postscriptname" mode="assign"><string>SegoeUI</string></edit>
  </match>
  <match target="scan">
    <test name="postscriptname"><string>Selawik-Light</string></test>
    <edit name="fullname" mode="prepend"><string>Segoe UI Light</string></edit>
    <edit name="postscriptname" mode="assign"><string>SegoeUI-Light</string></edit>
  </match>
  <match target="scan">
    <test name="postscriptname"><string>Selawik-Semilight</string></test>
    <edit name="fullname" mode="prepend"><string>Segoe UI Semilight</string></edit>
    <edit name="postscriptname" mode="assign"><string>SegoeUI-Semilight</string></edit>
  </match>
  <match target="scan">
    <test name="postscriptname"><string>Selawik-Semibold</string></test>
    <edit name="fullname" mode="prepend"><string>Segoe UI Semibold</string></edit>
    <edit name="postscriptname" mode="assign"><string>SegoeUI-Semibold</string></edit>
  </match>
  <match target="scan">
    <test name="postscriptname"><string>Selawik-Bold</string></test>
    <edit name="fullname" mode="prepend"><string>Segoe UI Bold</string></edit>
    <edit name="postscriptname" mode="assign"><string>SegoeUI-Bold</string></edit>
  </match>
</fontconfig>
